services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qguard}
      POSTGRES_USER: ${POSTGRES_USER:-qguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qguard}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [postgres-data:/var/lib/postgresql/data]
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["1025:1025", "8025:8025"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-qguard}
      POSTGRES_USER: ${POSTGRES_USER:-qguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qguard}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:5173}
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      mailpit: {condition: service_started}
volumes:
  postgres-data:
