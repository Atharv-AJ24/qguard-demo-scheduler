spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/qguard}
    username: ${POSTGRES_USER:qguard}
    password: ${POSTGRES_PASSWORD:change-me}

  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties.mail.smtp.auth: ${MAIL_AUTH:false}
    properties.mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
  business-zone: ${BUSINESS_TIMEZONE:UTC}
  working-hours-start: ${WORKING_HOURS_START:09:00}
  working-hours-end: ${WORKING_HOURS_END:17:00}
  sender: ${MAIL_SENDER:demo@qguard.local}
  demo-recipient-email: ${DEMO_RECIPIENT_EMAIL:}

management.endpoints.web.exposure.include: health,info